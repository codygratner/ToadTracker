name: Build and Test

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    name: ${{ matrix.os }} - ${{ matrix.build_type }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        build_type: [Release, Debug]

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Configure CMake
      run: >
        cmake -B build
        -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}

    - name: Build All Targets
      run: cmake --build build --config ${{ matrix.build_type }} --parallel

    - name: Run Unit Tests
      run: ctest --test-dir build -C ${{ matrix.build_type }} --output-on-failure

    - name: Run ToadTracker CLI Self-Check (Windows)
      if: runner.os == 'Windows'
      run: .\build\apps\cli\${{ matrix.build_type }}\toad_cli.exe

    - name: Run ToadTracker CLI Self-Check (Unix)
      if: runner.os != 'Windows'
      run: ./build/apps/cli/toad_cli

    - name: Upload Binary Artifact (Release Only)
      if: matrix.build_type == 'Release'
      uses: actions/upload-artifact@v4
      with:
        name: toad-tracker-v0.1.1-${{ matrix.os }}
        path: |
          build/apps/cli/Release/toad_cli.exe
          build/apps/cli/toad_cli
